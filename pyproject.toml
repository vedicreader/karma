[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koshas"
dynamic = ["version"]
description = "kosha (कोश) — a treasury of your repo and environment context for coding agents. FTS5 + vector search + call graph, no LLMs required."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['repo-context','nbdev','devtool','code graph','code search']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fastprogress>=1.1.6",
    "ast-grep-py>=0.39.5",
    "pyskills>=0.0.4",
    "watchfiles>=1.1.1",
    "mcp>=1.2.0",
    "litesearch>=0.1.1",
]

[project.urls]
Repository = "https://github.com/vedicreader/kosha"
Documentation = "https://vedicreader.github.io/kosha/"

[project.entry-points.nbdev]
kosha = "kosha._modidx:d"

[project.entry-points.pyskills]
kosha = "kosha.skill"

[project.scripts]
kosha = "kosha.cli:main"
kosha-mcp = "kosha.mcp:main"

[tool.hatch.version]
path = "kosha/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kosha"]

[tool.hatch.build.targets.sdist]
include = ["/kosha", "/pyproject.toml", "/README.md"]

[tool.nbdev]
lib_name = "kosha"
lib_path = "kosha"

[dependency-groups]
dev = [
    "fossick>=0.0.10",
    "mcp>=1.2.0",
    "nbdev>=3.0.15",
    "notebook>=7.5.5",
    "slopometer>=0.0.1",
]
